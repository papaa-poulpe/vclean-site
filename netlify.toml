# Configuration de publication Netlify.
# Site statique : rien à compiler, Netlify sert directement la racine du dépôt.

[build]
  publish = "."
  command = ""

[build.processing]
  skip_processing = false

[build.processing.html]
  pretty_urls = true

# Le README est la doc interne du dépôt, pas une page du site.
# Netlify publiant la racine, il faut le masquer explicitement.
[[redirects]]
  from = "/README.md"
  to = "/"
  status = 301
  force = true
